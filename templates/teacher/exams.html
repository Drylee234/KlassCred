{% extends "teacher/_layout.html" %}
{% from "_macros.html" import header, empty %}
{% block content %}
{{ header('Exams', 'Choose an exam to begin the simulated assessment') }}

<div class="card">
  <div class="card-title">Available Exams</div>
  <button class="btn btn-sm" onclick="loadExams()">Refresh</button>
  <div id="exam_list" class="mt-16">{{ empty('📝', 'Click Refresh to load exams.') }}</div>
  <div id="examListResp" class="response-box"></div>
</div>
{% endblock %}
