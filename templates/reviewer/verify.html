{% extends "reviewer/_layout.html" %}
{% from "_macros.html" import header %}
{% block content %}
{{ header('Verify Users', 'Review and verify teachers and employers') }}

<div class="card section">
  <div class="verify-tabs" role="tablist">
    <button class="verify-tab active" data-tab="teachers" onclick="switchVerifyTab('teachers')">Teachers</button>
    <button class="verify-tab" data-tab="employers" onclick="switchVerifyTab('employers')">Employers</button>
  </div>

  <section id="teachers_panel" class="verify-panel active">
    <div class="card-title">Search teachers</div>
    <div id="v_picker"></div>

  </section>

  <section id="employers_panel" class="verify-panel">
    <div class="card-title">Search employers</div>
    <div id="e_picker"></div>

  </section>
</div>

<div class="card">
  <div class="card-title">Pending verification</div>
  <div id="v_pending"></div>
</div>
{% endblock %}
