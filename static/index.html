<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KlassCred — JSON</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
<pre id="json" class="response-box show" style="white-space:pre-wrap;word-break:break-word;">Loading…</pre>
<script>
(async () => {
  const el = document.getElementById('json');
  try {
    const response = await fetch('/health');
    const data = await response.json();
    el.textContent = JSON.stringify(data, null, 2);
  } catch (error) {
    el.textContent = JSON.stringify({ error: String(error) }, null, 2);
  }
})();
</script>
</body>
</html>
